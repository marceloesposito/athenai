# CI: protocollo, web e server (con Postgres). Lo sviluppo resta su GitHub; l'app non lo usa.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: athenai
          POSTGRES_USER: athenai
          POSTGRES_PASSWORD: athenai-dev
        ports: ["55432:5432"]
        options: --health-cmd "pg_isready -U athenai" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
