# Athenai in locale o su un server: Postgres + il server di Athenai (che serve anche l'app web).
# Accesso con email e password gestito dal server stesso: vedi deploy/README.md.
name: athenai

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: athenai
      POSTGRES_USER: athenai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-athenai-dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athenai -d athenai"]
      interval: 5s
      timeout: 3s
      retries: 20

  athenai:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://athenai:${POSTGRES_PASSWORD:-athenai-dev}@postgres:5432/athenai
      PORT: 8787
      STATIC_DIR: /app/web/dist
      # registrazioni aperte (false per un server privato) e segreto per i parametri finti delle email sconosciute
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      SERVER_SECRET: ${SERVER_SECRET:-cambiami-in-produzione}
    ports:
      - "127.0.0.1:${ATHENAI_PORT:-8787}:8787"

volumes:
  pgdata:
